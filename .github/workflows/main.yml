
name: Build ZarKits

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar plugin
        run: mvn clean package

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZarKits
          path: target/*.jar
