
name: Build ZarKits

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ZarKits-GitHub-Ready/ZarKits/pom.xml

      - name: Compilar plugin
        working-directory: ZarKits-GitHub-Ready/ZarKits
        run: mvn clean package

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZarKits
          path: ZarKits-GitHub-Ready/ZarKits/target/*.jar
